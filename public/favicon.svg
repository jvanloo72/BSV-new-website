<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <!-- BSV favicon: the derived convergence mark (mark.svg) rendered as a
       standalone file. Unlike the in-app mark (which inherits currentColor so
       text-accent themes it), the favicon is not theme-following, so the brand
       accent rust (#9a3f1a, the locked D-02 accent) is set explicitly here.
       Same converging-linework glyph distilled from the hero motif. -->
